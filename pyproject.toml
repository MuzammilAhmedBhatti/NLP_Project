[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modprecedent"
version = "0.1.0"
description = "Leakage-aware RAG predictions for Meta Oversight Board decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "joblib>=1.3",
  "langchain-core>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "tenacity>=8.2",
  "tabulate>=0.9",
  "python-multipart>=0.0.9",
  "rapidocr-onnxruntime>=1.4",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
models = ["transformers>=5.0", "torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
frontend = ["gradio>=5.0"]
all = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "transformers>=5.0", "torch>=2.2", "torchvision>=0.17", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "gradio>=5.0"]

[project.scripts]
modprecedent = "modprecedent.cli:main"
modprecedent-app = "modprecedent.ui.gradio_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

